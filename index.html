<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>ตงฉินกินอะไรดี?</title>


<style>

/* =========================================================
   FONT
========================================================= */

@import url(
  'https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&display=swap'
);


/* =========================================================
   RESET
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {

  background:
    radial-gradient(
      circle at 20% 15%,
      #fffdf5 0 8%,
      transparent 25%
    ),
    linear-gradient(
      180deg,
      #fff9ed,
      #fff2d4
    );

  color: #65432d;

  font-family:
    "Mitr",
    sans-serif;

  overflow-x: hidden;
}

button {
  font-family: inherit;
}


/* =========================================================
   PAGE
========================================================= */

.page {

  min-height: 100vh;

  position: relative;

  overflow: hidden;

  display: flex;
  flex-direction: column;
  align-items: center;
}


/* =========================================================
   BACKGROUND DECORATION
========================================================= */

.sun {

  position: absolute;

  width: 250px;
  height: 250px;

  border-radius: 50%;

  background: #ffd878;

  opacity: .16;

  top: -110px;
  right: -90px;
}


.cloud {

  position: absolute;

  width: 100px;
  height: 30px;

  background: white;

  border-radius: 30px;

  opacity: .5;
}

.cloud::before,
.cloud::after {

  content: "";

  position: absolute;

  background: white;

  border-radius: 50%;
}

.cloud::before {

  width: 45px;
  height: 45px;

  left: 15px;
  bottom: 5px;
}

.cloud::after {

  width: 55px;
  height: 55px;

  right: 10px;
  bottom: 0;
}

.cloud.one {

  top: 170px;
  left: -35px;
}

.cloud.two {

  top: 390px;
  right: -45px;

  transform: scale(.7);
}


/* =========================================================
   HEADER
========================================================= */

.header {

  text-align: center;

  padding-top: 48px;

  position: relative;

  z-index: 5;
}

.subtitle {

  color: #e99b28;

  font-size:
    clamp(15px, 4vw, 20px);

  margin-bottom: 3px;

  letter-spacing: .5px;
}

.title {

  margin: 0;

  color: #70472e;

  font-size:
    clamp(42px, 10vw, 66px);

  font-weight: 700;

  line-height: 1.15;

  letter-spacing: -2px;
}

.title .orange {
  color: #f49c20;
}

.title-line {

  width: 115px;
  height: 5px;

  background: #f5ae37;

  border-radius: 99px;

  margin: 12px auto 0;
}


/* =========================================================
   HEADER SPARKS
========================================================= */

.spark {

  position: absolute;

  color: #f2a128;

  font-size: 22px;

  animation:
    floating
    3s
    ease-in-out
    infinite;
}

.spark.s1 {

  left: -35px;
  top: 50px;
}

.spark.s2 {

  right: -35px;
  top: 10px;

  animation-delay: .8s;
}

@keyframes floating {

  0%,
  100% {
    transform:
      translateY(0)
      rotate(0);
  }

  50% {
    transform:
      translateY(-7px)
      rotate(8deg);
  }

}


/* =========================================================
   MACHINE AREA
========================================================= */

.machine-area {

  position: relative;

  width:
    min(90vw, 450px);

  margin-top: 38px;

  display: flex;

  justify-content: center;
}

.machine {

  width:
    min(78vw, 360px);

  position: relative;

  z-index: 5;
}


/* =========================================================
   WOLF EARS
========================================================= */

.wolf-ears {

  position: absolute;

  width: 100%;

  height: 120px;

  top: -35px;
  left: 0;

  z-index: 2;

  pointer-events: none;
}

.ear-svg {

  position: absolute;

  width: 100px;
  height: 115px;
}

.left-ear {

  left: 28px;

  transform:
    rotate(-12deg);
}

.right-ear {

  right: 28px;

  transform:
    rotate(12deg);
}

.ear-outer {
  fill: #553724;
}

.ear-inner {
  fill: #c47b55;
}

.ear-highlight {

  fill: #e6a47c;

  opacity: .55;
}


/* =========================================================
   WOLF TAIL
========================================================= */

.wolf-tail {

  position: absolute;

  right: -55px;
  bottom: 55px;

  width: 145px;
  height: 185px;

  z-index: 1;

  transform:
    rotate(-7deg);

  pointer-events: none;
}

.wolf-tail svg {

  width: 100%;
  height: 100%;

  overflow: visible;
}

.tail-main {
  fill: #593925;
}

.tail-light {
  fill: #7b5138;
}

.tail-tip {
  fill: #d69a72;
}


/* =========================================================
   GLASS
========================================================= */

.glass {

  width: 100%;

  aspect-ratio: .98;

  border-radius:
    50%
    50%
    44%
    44%;

  position: relative;

  overflow: hidden;

  background:
    radial-gradient(
      circle at 35% 20%,
      rgba(255,255,255,.9),
      rgba(255,255,255,.35) 30%,
      rgba(255,224,170,.18) 70%
    );

  border:
    5px solid #f2d59e;

  box-shadow:

    inset
    0 0
    35px
    rgba(255,255,255,.7),

    0
    8px
    15px
    rgba(150,92,25,.08);

  z-index: 4;
}


/* =========================================================
   GLASS SHINE
========================================================= */

.glass-shine {

  position: absolute;

  width: 42px;
  height: 115px;

  border-radius: 50%;

  background:
    rgba(255,255,255,.7);

  transform:
    rotate(27deg);

  left: 30px;
  top: 25px;

  filter: blur(1px);

  z-index: 20;
}


/* =========================================================
   FOOD BALL CONTAINER
=========================================================
*/

.foods {

  position: absolute;

  left: 4%;
  right: 4%;

  bottom: 13px;

  height: 55%;

  display: block;

  z-index: 3;
}


/* =========================================================
   FOOD BALL
========================================================= */

.food-ball {

  position: absolute;

  width: 56px;
  height: 56px;

  border-radius: 50%;

  background:
    linear-gradient(
      145deg,
      #ffd66b,
      #f6a932
    );

  border:
    3px solid
    rgba(255,255,255,.72);

  display: flex;

  justify-content: center;
  align-items: center;

  font-size: 27px;

  box-shadow:

    0
    5px
    8px
    rgba(120,70,20,.13),

    inset
    3px
    3px
    7px
    rgba(255,255,255,.45);

  transition:
    transform .25s ease,
    left .25s ease,
    bottom .25s ease;

  transform-origin: center;

  user-select: none;
}


/* highlight เล็ก ๆ บนลูกบอล */

.food-ball::after {

  content: "";

  position: absolute;

  width: 13px;
  height: 7px;

  border-radius: 50%;

  background:
    rgba(255,255,255,.42);

  top: 8px;
  left: 11px;

  transform:
    rotate(-25deg);
}


/* =========================================================
   FOOD BALL POSITIONS
========================================================= */

/*
   แต่ละลูกอยู่คนละระดับ
   มีการซ้อนกันเล็กน้อย
*/

.food-ball:nth-child(1) {

  left: 8%;
  bottom: 5%;

  transform:
    rotate(-17deg)
    scale(.94);

  z-index: 2;
}

.food-ball:nth-child(2) {

  left: 25%;
  bottom: 2%;

  transform:
    rotate(11deg)
    scale(.98);

  z-index: 3;
}

.food-ball:nth-child(3) {

  left: 45%;
  bottom: 5%;

  transform:
    rotate(-8deg)
    scale(.93);

  z-index: 2;
}

.food-ball:nth-child(4) {

  left: 66%;
  bottom: 3%;

  transform:
    rotate(16deg)
    scale(.98);

  z-index: 3;
}

.food-ball:nth-child(5) {

  left: 2%;
  bottom: 24%;

  transform:
    rotate(12deg)
    scale(.96);

  z-index: 4;
}

.food-ball:nth-child(6) {

  left: 22%;
  bottom: 20%;

  transform:
    rotate(-14deg)
    scale(1);

  z-index: 5;
}

.food-ball:nth-child(7) {

  left: 45%;
  bottom: 23%;

  transform:
    rotate(8deg)
    scale(.95);

  z-index: 4;
}

.food-ball:nth-child(8) {

  left: 68%;
  bottom: 21%;

  transform:
    rotate(-11deg)
    scale(.98);

  z-index: 5;
}


/* =========================================================
   CATEGORY
========================================================= */

.category-box {

  position: absolute;

  width: 190px;
  height: 54px;

  left: 50%;
  top: 48%;

  transform:
    translate(-50%, -50%);

  z-index: 30;

  background:
    rgba(255,251,242,.96);

  border:
    4px solid #efa128;

  border-radius: 40px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding:
    0 12px;

  box-shadow:
    0
    5px
    0
    rgba(205,125,20,.12);
}

.category {

  color: #70462c;

  font-size: 18px;

  font-weight: 600;

  white-space: nowrap;
}

.category-arrow {

  border: 0;

  background: none;

  color: #e9931f;

  font-size: 30px;

  line-height: 1;

  padding:
    0 3px;

  cursor: pointer;
}


/* =========================================================
   MACHINE BODY
========================================================= */

.machine-body {

  height: 220px;

  margin-top: -10px;

  background:
    linear-gradient(
      180deg,
      #ffbd3c 0%,
      #f49b20 100%
    );

  border-radius:
    28px
    28px
    55px
    55px;

  position: relative;

  z-index: 8;

  box-shadow:

    inset
    0
    8px
    0
    rgba(255,255,255,.16),

    0
    9px
    0
    #dd8618,

    0
    15px
    25px
    rgba(139,79,20,.1);
}


/* =========================================================
   PAW LOGO
========================================================= */

.paw-logo {

  position: absolute;

  left: 23px;
  top: 30px;

  font-size: 27px;

  opacity: .28;
}


/* =========================================================
   CLICK BUTTON
========================================================= */

.click-button {

  position: absolute;

  top: 27px;
  left: 50%;

  transform:
    translateX(-50%);

  width: 94px;
  height: 94px;

  border-radius: 50%;

  border:
    5px solid #e88d19;

  background:
    #fff8e8;

  color:
    #e78e1c;

  font-size: 18px;

  font-weight: 700;

  cursor: pointer;

  box-shadow:

    0
    6px
    0
    #d77b12,

    inset
    0
    4px
    8px
    rgba(255,255,255,.8);

  transition: .12s;
}

.click-button:active {

  transform:
    translate(-50%, 6px);

  box-shadow:
    0
    1px
    0
    #d77b12;
}

.click-button.glow {

  animation:
    buttonGlow
    .7s
    ease;
}

@keyframes buttonGlow {

  0% {

    box-shadow:
      0 6px 0 #d77b12;
  }

  50% {

    box-shadow:

      0
      6px
      0
      #d77b12,

      0
      0
      35px
      #fff4a7;
  }

  100% {

    box-shadow:
      0 6px 0 #d77b12;
  }

}


/* =========================================================
   OUTLET
========================================================= */

.outlet {

  position: absolute;

  width: 105px;
  height: 72px;

  left: 50%;
  bottom: 0;

  transform:
    translateX(-50%);

  background:
    #603a28;

  border-radius:
    55px
    55px
    0
    0;

  overflow: hidden;
}

.outlet::after {

  content: "";

  position: absolute;

  width: 58px;
  height: 23px;

  background:
    #a87858;

  border-radius: 50%;

  left: 23px;
  bottom: 6px;
}


/* =========================================================
   HINT
========================================================= */

.hint {

  position: absolute;

  right: -75px;
  bottom: 120px;

  background:
    #fff9e9;

  color:
    #865535;

  padding:
    8px 13px;

  border-radius: 20px;

  font-size: 14px;

  box-shadow:
    0
    5px
    15px
    rgba(120,70,20,.1);

  transform:
    rotate(4deg);

  z-index: 20;
}

.hint::before {

  content: "";

  position: absolute;

  width: 20px;
  height: 20px;

  left: -9px;
  bottom: 2px;

  border-left:
    3px solid #e8a02b;

  border-bottom:
    3px solid #e8a02b;

  transform:
    rotate(30deg);
}


/* =========================================================
   MOOD
========================================================= */

.mood-area {

  margin-top: 30px;

  text-align: center;

  position: relative;

  z-index: 10;
}

.mood-title {

  color:
    #9b673f;

  font-size: 15px;

  margin-bottom: 9px;
}

.moods {

  display: flex;

  justify-content: center;

  gap: 7px;

  flex-wrap: wrap;
}

.mood {

  border:
    2px solid #f2c16c;

  background:
    #fff9ed;

  color:
    #9b663b;

  border-radius:
    25px;

  padding:
    7px 13px;

  font-size: 13px;

  cursor: pointer;

  transition: .2s;
}

.mood.active {

  background:
    #f6a52a;

  border-color:
    #f6a52a;

  color:
    white;

  transform:
    translateY(-2px);
}


/* =========================================================
   BOTTOM
========================================================= */

.bottom {

  width: 100%;

  min-height: 105px;

  margin-top: 42px;

  background:
    #ffe5aa;

  position: relative;

  display: flex;

  justify-content: center;

  align-items: center;

  padding-bottom: 15px;
}

.bottom::before {

  content: "";

  position: absolute;

  top: -23px;
  left: -5%;

  width: 110%;
  height: 48px;

  background:
    #ffe5aa;

  border-radius: 50%;
}

.bottom-item {

  position: relative;

  z-index: 2;

  color:
    #ca822b;

  font-size: 17px;

  padding:
    15px 35px;
}


/* =========================================================
   RESULT
========================================================= */

.result {

  position: fixed;

  inset: 0;

  background:
    rgba(75,45,27,.43);

  backdrop-filter:
    blur(7px);

  z-index: 100;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;

  opacity: 0;

  pointer-events: none;

  transition: .3s;
}

.result.show {

  opacity: 1;

  pointer-events: auto;
}

.result-card {

  width:
    min(90vw, 400px);

  background:
    #fffaf0;

  border-radius:
    32px;

  padding:
    30px 25px 28px;

  text-align: center;

  box-shadow:
    0
    20px
    60px
    rgba(65,35,15,.2);

  transform:
    scale(.7)
    translateY(30px);

  transition:
    .35s
    cubic-bezier(.2,.8,.2,1);
}

.result.show .result-card {

  transform:
    scale(1)
    translateY(0);
}

.result-top {

  color:
    #e89a29;

  font-size:
    17px;
}

.result-emoji {

  font-size:
    70px;

  margin:
    12px 0 4px;
}

.result-name {

  color:
    #70472e;

  font-size:
    32px;

  font-weight:
    700;
}

.result-comment {

  color:
    #a06c45;

  margin:
    5px 0 23px;

  font-size:
    15px;
}

.result-buttons {

  display: flex;

  gap: 8px;

  justify-content: center;
}

.result-btn {

  border: 0;

  border-radius:
    25px;

  padding:
    12px 19px;

  font-size:
    15px;

  cursor: pointer;
}

.try-again {

  background:
    #f5a329;

  color:
    white;
}

.close-result {

  background:
    #f4e5ca;

  color:
    #8c603e;
}


/* =========================================================
   CONFETTI
========================================================= */

.confetti {

  position: fixed;

  width: 9px;
  height: 13px;

  top: 40%;
  left: 50%;

  z-index: 150;

  pointer-events: none;

  animation:
    confettiFall
    1.1s
    ease-out
    forwards;
}

@keyframes confettiFall {

  0% {

    opacity: 1;

    transform:
      translate(0,0)
      rotate(0);
  }

  100% {

    opacity: 0;

    transform:
      translate(
        calc(var(--x) * 1px),
        calc(var(--y) * 1px)
      )
      rotate(500deg);
  }
}


/* =========================================================
   MACHINE SHAKE
========================================================= */

.machine.shake {

  animation:
    machineShake
    .90s
    ease;
}

@keyframes machineShake {

  0% {
    transform: rotate(0);
  }

  15% {
    transform:
      rotate(-4deg)
      translateY(1px);
  }

  30% {
    transform:
      rotate(4deg);
  }

  45% {
    transform:
      rotate(-3deg);
  }

  60% {
    transform:
      rotate(3deg);
  }

  75% {
    transform:
      rotate(-1deg);
  }

  100% {
    transform:
      rotate(0);
  }
}


/* =========================================================
   FOOD BOUNCE
========================================================= */

.food-ball.bounce {

  animation:
    ballBounce
    .67s
    ease;
}

@keyframes ballBounce {

  0% {

    transform:
      translateY(0)
      rotate(var(--rotation));
  }

  35% {

    transform:
      translateY(-13px)
      rotate(
        calc(
          var(--rotation) + 5deg
        )
      )
      scale(1.05);
  }

  65% {

    transform:
      translateY(4px)
      rotate(
        calc(
          var(--rotation) - 3deg
        )
      );
  }

  100% {

    transform:
      translateY(0)
      rotate(var(--rotation));
  }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width:520px) {

  .header {
    padding-top: 35px;
  }

  .machine-area {
    margin-top: 30px;
  }

  .machine {
    width: 78vw;
  }

  .wolf-tail {

    right: -30px;

    transform:
      rotate(-7deg)
      scale(.85);
  }

  .hint {

    right: -30px;

    bottom: 105px;

    font-size: 12px;
  }

  .mood-area {

    margin-top: 25px;

    padding:
      0 15px;
  }

}


@media (max-width:390px) {

  .wolf-tail {
    display: none;
  }

  .hint {
    right: 0;
  }

  .food-ball {

    width: 49px;
    height: 49px;

    font-size: 23px;
  }

}


/* =========================================================
   SMALL TABLET / IPAD
========================================================= */

@media (min-width:700px) {

  .machine-area {
    margin-top: 45px;
  }

  .machine {
    width: 390px;
  }

  .food-ball {
    width: 62px;
    height: 62px;
    font-size: 30px;
  }

}

</style>

</head>


<body>

  <!-- BACKGROUND -->

  <div class="sun"></div>

  <div class="cloud two"></div>


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="header">

    <div class="spark s1">
      ✦
    </div>

    <div class="spark s2">
      ✦
    </div>


    <div class="subtitle">
      ปัญหาที่เจอทุกวัน...
    </div>


    <h1 class="title">

      วันนี้กิน
      <span class="orange">
        อะไรดี?
      </span>

    </h1>


    <div class="title-line"></div>

  </header>


  <!-- =====================================================
       MACHINE
  ====================================================== -->

  <section class="machine-area">


    <!-- WOLF TAIL -->

    <div class="wolf-tail">

      <svg viewBox="0 0 150 190">

        <path
          class="tail-main"
          d="
          M32 174
          C70 170 113 144 116 103
          C118 77 105 55 88 44
          C111 53 137 76 137 109
          C137 151 106 182 64 188
          C48 190 36 185 32 174Z
          "
        />

        <path
          class="tail-light"
          d="

          C105 160 124 136 125 108

          C127 142 106 166 73 176Z
          "
        />

        <path
          class="tail-tip"
          d="
          M95 55

          "
        />

    </div>


    <!-- MACHINE -->

    <div class="machine">


      <!-- WOLF EARS -->

      <div class="wolf-ears">


        <svg
          class="ear-svg left-ear"
          viewBox="0 0 100 115"
        >

          <path
            class="ear-outer"
            d="
            M8 100
            C12 67 19 28 50 5
            C66 25 83 60 91 102
            C62 89 35 88 8 100Z
            "
          />

          <path
            class="ear-inner"
            d="
            M29 82
            C33 58 39 31 50 20
            C59 37 67 60 72 83
            C57 76 43 76 29 82Z
            "
          />

          <path
            class="ear-highlight"
            d="
            M42 66
            C44 47 47 34 50 27
            C55 41 59 57 61 70
            C54 66 48 65 42 66Z
            "
          />

        </svg>


        <svg
          class="ear-svg right-ear"
          viewBox="0 0 100 115"
        >

          <path
            class="ear-outer"
            d="
            M8 100
            C12 67 19 28 50 5
            C66 25 83 60 91 102
            C62 89 35 88 8 100Z
            "
          />

          <path
            class="ear-inner"
            d="
            M29 82
            C33 58 39 31 50 20

======================================================== -->

<div

>


  <div class="result-card">


    <div class="result-top">
      ✨ วันนี้ ลีโอ ขอเสนอ...

    <div
      class="result-emoji"

    >

    <div
      class="result-name"
      id="resultName"
    >
      ราเมง
    </div>


    <div
      class="result-comment"
      id="resultComment"
    >
      อันนี้ ไหมครับ ? 🐺
    </div>


    <div class="result-buttons">


      <button
        class="result-btn try-again"
        onclick="randomFood()"
      >
        🎲 สุ่มใหม่
      </button>


      <button
        class="result-btn close-result"
        onclick="closeResult()"
      >
        เอา อันนี้ นะครับ
      </button>


    </div>


  </div>


</div>


<script>


/* =========================================================
   FOOD DATABASE
========================================================= */

const foods = {


  "ทั้งหมด": [

    ["🍚","ข้าวกะเพรา"],
    ["🍜","ก๋วยเตี๋ยว"],
    ["🍣","ซูชิ"],
    ["🍛","ข้าวแกง"],
    ["🍕","พิซซ่า"],
    ["🍔","เบอร์เกอร์"],
    ["🥟","เกี๊ยวน้ำ"],
    ["🥪","แซนวิช ( อีกแล้ว ? หรอ )"],
    ["🍗","ไก่ทอด"],
    ["🍲","ชาบู"],
    ["🍝","สปาเกตตี"],
    ["🥗","สลัด"],
    ["🍛","ข้าวมันไก่"],
    ["🍲","ต้มยำ"],
    ["🥚","ข้าวไข่เจียว"],
    ["🍱","ทงคัตสึ"],
    ["🍜","ราเมง"],
    ["🍛","แกงกะหรี่"],
    ["🍤","เทมปุระ"],
    ["🥟","เกี๊ยวน้ำ"],
    ["🍥","ซาลาเปา"],
    ["🥘","ข้าวอบหม้อดิน"],
    ["🍥","เต้าหู้มาโป"],
    ["🥡","หมี่ไก่ฉีก"],
    ["🌭","ฮอตดอก"],
    ["🌯","แรพไก่"],
    ["🍟","เฟรนฟราย"],
    ["🐆","เลือกเยอะ เดี๋ยว ลีโอ พาไป กิน ครับ."]
    

  ],


  "อาหารไทย": [

    ["🍚","ข้าวกะเพรา"],
    ["🍜","ก๋วยเตี๋ยว"],
    ["🍛","ข้าวมันไก่"],
    ["🍲","ต้มยำ"],
    ["🥚","ข้าวไข่เจียว"]

  ],


  "อาหารญี่ปุ่น": [

    ["🍣","ซูชิ"],
    ["🍱","ทงคัตสึ"],
    ["🍜","ราเมง"],
    ["🍛","แกงกะหรี่"],
    ["🍤","เทมปุระ"]

  ],


  "อาหารจีน": [

    ["🥟","เกี๊ยวน้ำ"],
    ["🍥","ซาลาเปา"],
    ["🥘","ข้าวอบหม้อดิน"],
    ["🍥","เต้าหู้มาโป"],
    ["🥡","หมี่ไก่ฉีก"]

  ],


  "Fast Food": [

    ["🍔","เบอร์เกอร์"],
    ["🍕","พิซซ่า"],
    ["🍗","ไก่ทอด"],
    ["🌭","ฮอตดอก"],
    ["🌯","แรพไก่"],
    ["🥪","แซนวิช ( อีกแล้ว ? หรอ )"],
    ["🍟","เฟรนฟราย"]

  ],


  "ของหวาน": [

    ["🥮","ขนมพระจันทร์"],
    ["🍰","เค้ก"],
    ["🧇","วาฟเฟิล"],
    ["🍩","โดนัท"],
    ["🥐","ครัวซองต์"],
    ["🍞","ขนมปัง"],
    ["🥞","แพนเค้ก"]
    

  ]

};


/* =========================================================
   VARIABLES
========================================================= */

const categories =
  Object.keys(foods);

let categoryIndex = 0;

let mood = "all";

let randomCount = 0;


/* =========================================================
   CATEGORY
========================================================= */

function updateCategory() {

  document
    .getElementById("category")
    .textContent =
    categories[categoryIndex];

}


function nextCategory() {

  categoryIndex++;

  if (
    categoryIndex >=
    categories.length
  ) {

    categoryIndex = 0;

  }

  updateCategory();

}


function previousCategory() {

  categoryIndex--;

  if (categoryIndex < 0) {

    categoryIndex =
      categories.length - 1;

  }

  updateCategory();

}


/* =========================================================
   MOOD
========================================================= */

function selectMood(
  button,
  selectedMood
) {

  document
    .querySelectorAll(".mood")
    .forEach(
      btn =>
        btn.classList.remove("active")
    );

  button.classList.add("active");

  mood = selectedMood;

}


/* =========================================================
   RANDOM FOOD
========================================================= */

function randomFood() {


  const machine =
    document.querySelector(".machine");


  const button =
    document.getElementById(
      "clickButton"
    );


  machine.classList.remove("shake");

  button.classList.remove("glow");


  void machine.offsetWidth;


  machine.classList.add("shake");

  button.classList.add("glow");


  /*
     ทำให้ลูกบอลทั้งหมดเด้ง
  */

  document
    .querySelectorAll(".food-ball")
    .forEach(
      (ball, index) => {

        setTimeout(() => {

          ball.classList.remove(
            "bounce"
          );

          void ball.offsetWidth;

          ball.classList.add(
            "bounce"
          );

        }, index * 45);

      }
    );


  randomCount++;


  const category =
    categories[categoryIndex];


  let list =
    foods[category];


  /* =====================================================
     MOOD FILTER
  ====================================================== */

  if (mood === "cheap") {

    list =
      list.filter(
        item =>
          [
            "🍔",
            "🍗",
            "🍟",
            "🌭",
            "🌯",
            "🥪",
            "🥟",
          
          ].includes(item[0])
      );

  }


  if (mood === "light") {

    list =
      list.filter(
        item =>
          [
            "🍟",
            "🌭",
            "🌯",
            "🥪",
            "🥟",
            "🍤",
            "🥟",
            "🍥",
            "🥐",
            "🥗",
          ].includes(item[0])
      );

  }


  if (mood === "heavy") {

    list =
      list.filter(
        item =>
          [
            "🍔",
            "🍗",
            "🥘",
            "🍛",
            "🍝",
            "🍕",
            "🍚",
            "🍜"
          ].includes(item[0])
      );

  }


  /*
     ถ้ากรองแล้วไม่มีอาหาร
     ให้กลับไปใช้รายการเดิม
  */

  if (list.length === 0) {

    list =
      foods[category];

  }


  /*
     RANDOM
  */

  const random =
    list[
      Math.floor(
        Math.random() *
        list.length
      )
    ];


  setHint();


  /*
     แสดงผลหลัง animation
  */

  setTimeout(() => {


    document
      .getElementById("resultEmoji")
      .textContent =
      random[0];


    document
      .getElementById("resultName")
      .textContent =
      random[1];


    document
      .getElementById("resultComment")
      .textContent =
      getComment();


    document
      .getElementById("result")
      .classList
      .add("show");


    createConfetti();


  }, 700);

}


/* =========================================================
   RANDOM COMMENT
========================================================= */

function getComment() {


  if (randomCount >= 5) {

    return
      "สุ่ม หลายรอบแล้ว... อันนี้ ไหมครับ ? ";

  }


  const comments = [

    "อันนี้ แหละ กินเถอะ ครับ.",

    "วันนี้ ดูเหมือน จะต้อง กิน อันนี้ นะครับ.",

    "ลีโอ ว่า อันนี้ น่ากิน ครับ.",

    "เลือกได้แล้ว หรือยังครับ ? 🍊",

    "คิดเยอะ ระวัง ไม่ได้กิน นะครับ.",

    "ตงฉิน อนุมัติ ทีครับ. 🐺"

  ];


  return comments[
    Math.floor(
      Math.random() *
      comments.length
    )
  ];

}


/* =========================================================
   HINT
========================================================= */

function setHint() {


  const hint =
    document.getElementById(
      "hint"
    );


  const messages = [

    "กดเลย! 🐺",

    "ลองดูสิ 👀",

    "วันนี้ กิน อะไรครับ ?",

  ];


  hint.textContent =
    messages[
      Math.floor(
        Math.random() *
        messages.length
      )
    ];

}


/* =========================================================
   CONFETTI
========================================================= */

function createConfetti() {


  const symbols = [

    "✦",
    "•",
    "♥",
    "✧",
    "●"

  ];


  for (
    let i = 0;
    i < 20;
    i++
  ) {


    const piece =
      document.createElement(
        "div"
      );


    piece.className =
      "confetti";


    piece.textContent =
      symbols[
        Math.floor(
          Math.random() *
          symbols.length
        )
      ];


    piece.style.setProperty(
      "--x",
      (Math.random() - .5) * 500
    );


    piece.style.setProperty(
      "--y",
      Math.random() * 500 + 100
    );


    piece.style.color = [

      "#f4a129",
      "#ffc94f",
      "#d77839",
      "#9c633e"

    ][
      Math.floor(
        Math.random() * 4
      )
    ];


    document
      .body
      .appendChild(piece);


    setTimeout(() => {

      piece.remove();

    }, 1200);

  }

}


/* =========================================================
   CLOSE RESULT
========================================================= */

function closeResult() {

  document
    .getElementById("result")
    .classList
    .remove("show");

}


function closeOutside(event) {

  if (
    event.target ===
    document.getElementById("result")
  ) {

    closeResult();

  }

}


/* =========================================================
   RANDOMIZE BALL POSITION
========================================================= */

/*
   ทำให้ลูกบอลแต่ละรอบไม่เรียงเหมือนเดิมเป๊ะ
*/

function arrangeFoodBalls() {


  const balls =
    document.querySelectorAll(
      ".food-ball"
    );


  const basePositions = [

    {
      left: 8,
      bottom: 5,
      rotate: -17,
      scale: .94
    },

    {
      left: 25,
      bottom: 2,
      rotate: 11,
      scale: .98
    },

    {
      left: 45,
      bottom: 5,
      rotate: -8,
      scale: .93
    },

    {
      left: 66,
      bottom: 3,
      rotate: 16,
      scale: .98
    },

    {
      left: 2,
      bottom: 24,
      rotate: 12,
      scale: .96
    },

    {
      left: 22,
      bottom: 20,
      rotate: -14,
      scale: 1
    },

    {
      left: 45,
      bottom: 23,
      rotate: 8,
      scale: .95
    },

    {
      left: 68,
      bottom: 21,
      rotate: -11,
      scale: .98
    }

  ];


  balls.forEach(
    (ball, index) => {


      const base =
        basePositions[index];


      /*
         random variation
         เล็กน้อยเพื่อให้กองดูธรรมชาติ
      */

      const leftVariation =
        (Math.random() - .5) * 5;


      const bottomVariation =
        (Math.random() - .5) * 5;


      const rotationVariation =
        (Math.random() - .5) * 8;


      const scaleVariation =
        (Math.random() - .5) * .06;


      const left =
        base.left +
        leftVariation;


      const bottom =
        base.bottom +
        bottomVariation;


      const rotation =
        base.rotate +
        rotationVariation;


      const scale =
        base.scale +
        scaleVariation;


      ball.style.left =
        left + "%";


      ball.style.bottom =
        bottom + "%";


      ball.style.setProperty(
        "--rotation",
        rotation + "deg"
      );


      ball.style.transform =
        `
          rotate(${rotation}deg)
          scale(${scale})
        `;


    }
  );

}


/* =========================================================
   INITIALIZE
========================================================= */

updateCategory();

arrangeFoodBalls();


</script>
